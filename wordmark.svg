<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;display=swap');
      .wordmark {
        font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
        font-weight: 800;
        text-transform: uppercase;
      }
    </style>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F5F0"/>
      <stop offset="22%" stop-color="#9AA0A8"/>
      <stop offset="45%" stop-color="#E8EAE3"/>
      <stop offset="60%" stop-color="#7C8290"/>
      <stop offset="80%" stop-color="#EDEEE7"/>
      <stop offset="100%" stop-color="#B8BCC2"/>
    </linearGradient>
  </defs>

  <!-- transparent background so it drops onto the template's dark hero as-is -->
  <rect width="1200" height="320" fill="none"/>

  <text
    x="600"
    y="245"
    text-anchor="middle"
    class="wordmark"
    font-size="230"
    letter-spacing="-6"
  >
    <tspan fill="url(#chrome)">FUELE</tspan><tspan fill="#FFFFFF">D</tspan>
  </text>
</svg>
